name: New service
description: Ask cpa-pulse to support another service in CPA
title: "Support "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        cpa-pulse reads quota the same way as the CPA Management Center quota page. Remove emails, tokens and other account details from screenshots and responses.
  - type: input
    id: service
    attributes:
      label: Service
      placeholder: Example service
    validations:
      required: true
  - type: textarea
    id: windows
    attributes:
      label: Quota windows
      description: Which quota windows the plan has, such as 5-hour, 7-day or monthly
    validations:
      required: true
  - type: dropdown
    id: five-hour-start
    attributes:
      label: When the 5-hour window starts
      options:
        - At the first request after a reset
        - On a fixed schedule
        - No 5-hour window
        - Not sure
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot of the CPA Management Center quota page
    validations:
      required: true
  - type: textarea
    id: response
    attributes:
      label: Quota API response
      description: On the quota page, open the browser developer tools, select Network, and copy the response of the api-call request
      render: json
  - type: textarea
    id: notes
    attributes:
      label: Additional notes
      description: Include helpful details such as plan type, official documentation or unusual reset rules
  - type: checkboxes
    id: test
    attributes:
      label: Testing
      options:
        - label: I can test a new build
